<script>
$(document).ready(function() {
   $(document).foundation();
   $('#uform').submit(function(e){
      e.preventDefault();

      // do ajax now
      var s11 = $('#S11').val();
      if (s11.length!=11) {
         return goback();
      }

      var p8 = $('#P8').val();
      if (p8.length==0 || p8.length>8) {
         return goback();
      }
      while (p8.length<8) { p8 = '0' + p8; }

      var hex40 = $('#HEX40').val();
      if (hex40.length!=40) {
         return goback();
      }

      var tval = $('#TVAL').val();
      if (tval.length==0) {
         return goback();
      }

      var url = location.pathname + '?SIG=' + encodeURIComponent(s11 + p8 + hex40 + tval);
      location.href = url;
   });
})
function goback()
{
   window.alert('Ακατάλληλα δεδομένα, παρακαλούμε επαναλάβατε!');
   return false;
}
</script>
