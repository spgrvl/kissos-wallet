name: APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  assemble_demo_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Demo APK
        run: ./gradlew assembleDemo

      - name: Upload APK to Github Actions
        uses: actions/upload-artifact@v7
        with:
          name: Kissos-Demo.apk
          path: app/build/outputs/apk/demo/kissos-*-demo.apk
